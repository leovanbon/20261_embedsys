<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img">
<title>Lab 2 — Bổ sung bộ chuyển mức I2C hai chiều giữa Tiny RTC và bus 3.3V</title>
<style>text {font-family:"DejaVu Sans",sans-serif} .wire {fill:none;stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1600" height="850" fill="#f4f7fb"/>
<text x="55" y="65" font-size="34" fill="#182b43" font-weight="700" text-anchor="start">TÁCH MỨC ĐIỆN ÁP BUS I2C</text>
<text x="55" y="107" font-size="21" fill="#51647a" font-weight="400" text-anchor="start">Bổ sung cho Tiny RTC có điện trở kéo lên 5V • Không thay đổi firmware hoặc địa chỉ thiết bị</text>
<rect x="60" y="250" width="400" height="330" rx="12" fill="white" stroke="#cbd6e2" stroke-width="2"/>
<text x="84" y="286" font-size="25" fill="#182b43" font-weight="700" text-anchor="start">STM32 + OLED</text>
<text x="84" y="314" font-size="17" fill="#51647a" font-weight="400" text-anchor="start">Phía logic 3.3V</text>
<polyline class="wire" points="78,330 442,330" stroke="#dbe3ec" stroke-width="1"/>
<text x="84" y="362" font-size="23" fill="#007e87" font-weight="700" text-anchor="start">PA8 + OLED SCL</text>
<text x="84" y="422" font-size="23" fill="#2462cb" font-weight="700" text-anchor="start">PC9 + OLED SDA</text>
<text x="84" y="490" font-size="20" fill="#182b43" font-weight="400" text-anchor="start">OLED VCC → 3V của kit</text>
<text x="84" y="527" font-size="20" fill="#51647a" font-weight="400" text-anchor="start">I2C3: 100 kHz</text>
<rect x="650" y="250" width="330" height="330" rx="12" fill="white" stroke="#cbd6e2" stroke-width="2"/>
<text x="674" y="286" font-size="25" fill="#182b43" font-weight="700" text-anchor="start">CHUYỂN MỨC I2C</text>
<text x="674" y="314" font-size="17" fill="#51647a" font-weight="400" text-anchor="start">Hai chiều / open-drain</text>
