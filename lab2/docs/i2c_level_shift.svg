<circle cx="980" cy="415" r="5" fill="#2462cb"/>
<text x="962" y="422" font-size="20" fill="#2462cb" font-weight="500" text-anchor="end">HV2</text>
<polyline class="wire" points="460,355 650,355" stroke="#007e87" stroke-width="3"/>
<polyline class="wire" points="460,415 650,415" stroke="#2462cb" stroke-width="3"/>
<polyline class="wire" points="735,355 895,355" stroke="#007e87" stroke-width="2" stroke-dasharray="6 6"/>
<polyline class="wire" points="735,415 895,415" stroke="#2462cb" stroke-width="2" stroke-dasharray="6 6"/>
<text x="675" y="490" font-size="19" fill="#182b43" font-weight="400" text-anchor="start">Ví dụ: module BSS138</text>
<text x="675" y="523" font-size="18" fill="#51647a" font-weight="400" text-anchor="start">Có pull-up cả hai phía</text>
<polyline class="wire" points="715,250 715,208" stroke="#c83542" stroke-width="3"/>
<polyline class="wire" points="706,218 715,208 724,218" stroke="#c83542" stroke-width="3"/>
