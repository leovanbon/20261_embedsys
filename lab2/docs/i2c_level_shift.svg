<text x="1184" y="527" font-size="20" fill="#51647a" font-weight="400" text-anchor="start">Giữ pull-up về 5V</text>
<polyline class="wire" points="1350,250 1350,208" stroke="#c83542" stroke-width="3"/>
<polyline class="wire" points="1341,218 1350,208 1359,218" stroke="#c83542" stroke-width="3"/>
