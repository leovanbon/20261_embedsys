<polyline class="wire" points="250,580 250,604" stroke="#354357" stroke-width="3"/>
<polyline class="wire" points="237.0,604 263.0,604" stroke="#354357" stroke-width="2"/>
<polyline class="wire" points="242.0,611 258.0,611" stroke="#354357" stroke-width="2"/>
<polyline class="wire" points="247.0,618 253.0,618" stroke="#354357" stroke-width="2"/>
<text x="250" y="642" font-size="17" fill="#354357" font-weight="500" text-anchor="middle">GND</text>
<rect x="60" y="690" width="1480" height="110" rx="12" fill="white" stroke="#cbd6e2" stroke-width="2"/>
<text x="85" y="731" font-size="22" fill="#182b43" font-weight="700" text-anchor="start">GND của STM32, OLED, bộ chuyển mức và Tiny RTC phải nối chung.</text>
<text x="85" y="770" font-size="20" fill="#51647a" font-weight="400" text-anchor="start">Phía LV cần pull-up lên 3.3V; phía HV cần pull-up lên 5V. Không dùng cầu chia áp một chiều cho SDA.</text>
</svg>