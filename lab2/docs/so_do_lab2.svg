<text x="320" y="985" font-size="24" fill="#c83542" font-weight="700" text-anchor="start">+</text>
<text x="65" y="1007" font-size="23" fill="#182b43" font-weight="700" text-anchor="start">C1 = 100 µF</text>
<text x="65" y="1043" font-size="18" fill="#c83542" font-weight="400" text-anchor="start">Cực + → 3V</text>
<text x="65" y="1073" font-size="18" fill="#354357" font-weight="400" text-anchor="start">Cực − → GND</text>
<rect x="60" y="1150" width="1680" height="190" rx="12" fill="#fff7e9" stroke="#e3c58e" stroke-width="2"/>
<text x="85" y="1187" font-size="23" fill="#80500d" font-weight="700" text-anchor="start">LƯU Ý MỨC ĐIỆN ÁP I2C</text>
<text x="85" y="1222" font-size="21" fill="#182b43" font-weight="400" text-anchor="start">Tiny RTC trong đề có R2/R3 kéo SDA/SCL lên 5V, nhưng OLED được cấp 3V.</text>
<text x="85" y="1257" font-size="21" fill="#182b43" font-weight="400" text-anchor="start">Với module này, bổ sung chuyển mức I2C hai chiều: LV = 3.3V (STM32 + OLED), HV = 5V (Tiny RTC).</text>
<text x="85" y="1292" font-size="19" fill="#51647a" font-weight="400" text-anchor="start">(*) Giữ pin dự phòng đúng loại của module; không đấu thêm nguồn 3V song song với pin đang lắp.</text>
<text x="85" y="1321" font-size="18" fill="#51647a" font-weight="400" text-anchor="start">Xem sơ đồ i2c_level_shift.svg. Tất cả GND nối chung; chấm tròn là điểm nối, giao cắt không chấm không nối.</text>
<text x="60" y="1372" font-size="18" fill="#51647a" font-weight="400" text-anchor="start">Các chân ghi theo tên trên module, không theo vị trí hàng chân. Kiểm tra nhãn SCL/SDA trên OLED trước khi cắm.</text>
</svg>